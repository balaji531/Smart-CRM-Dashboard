<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <title>Electronics CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.1.0/dist/chartjs-chart-matrix.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
 </head>
 <body class="bg-gray-100 min-h-screen flex flex-col">
  
  <header class="w-full bg-blue-900 text-white p-4 flex flex-col md:flex-row items-center md:items-center justify-between">
    <h2 class="text-2xl font-extrabold mb-4 md:mb-0">
      Welcome to the CRM Dashboard,{{name}}
    </h2>
    <nav class="flex space-x-4 text-lg font-semibold overflow-x-auto">
      <a class="flex items-center space-x-2 py-2 px-3 rounded hover:bg-blue-700 transition whitespace-nowrap" href="/dashboard">
        <i class="fas fa-tachometer-alt text-xl"></i>
        <span>Overview</span>
      </a>
      <a class="flex items-center space-x-2 py-2 px-3 rounded hover:bg-blue-700 transition whitespace-nowrap" href="/sales">
        <i class="fas fa-chart-line text-xl"></i>
        <span>Sales</span>
      </a>
      <a class="flex items-center space-x-2 py-2 px-3 rounded hover:bg-blue-700 transition whitespace-nowrap" href="/products">
        <i class="fas fa-box-open text-xl"></i>
        <span>Products</span>
      </a>
      <a class="flex items-center space-x-2 py-2 px-3 rounded hover:bg-blue-700 transition whitespace-nowrap" href="/customers">
        <i class="fas fa-users text-xl"></i>
        <span>Customers</span>
      </a>
    </nav>
  </header>

  <main class="flex-1 p-6 overflow-auto">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
 </body>
</html>
